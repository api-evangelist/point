name: Point
description: >-
  Point (Point Digital Finance, Inc.) is a San Francisco fintech founded in 2015 by
  Eddie Lim, Eoin Matthews, and Alex Rampell that gives homeowners access to their home
  equity without monthly payments or income requirements. Its flagship Home Equity
  Investment (HEI) provides lump sums up to $600,000 in exchange for a share of a home's
  future appreciation over a 30-year term, alongside a HELOC product offering lines up to
  $750,000. Point has served more than 25,000 homeowners and facilitated over $2 billion in
  home equity investments, and is backed by a16z, Bloomberg Beta, and Ribbit Capital. Point
  is a consumer-facing platform with no public developer API; this profile was surfaced as a
  VC-portfolio lead and enriched with the API Evangelist pipeline (identity + domain-security
  probe only — no API surface found).
